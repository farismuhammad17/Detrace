[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detrace"
version = "1.0.0"
description = "A Cryptanalysis tool"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Faris Muhammad" }
]
keywords = ["cryptography", "cipher", "decryption", "cli", "security", "machine-learning"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "tensorflow>=2.0.0",
    "numpy>=2.5.0",
    "requests>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pylint>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/farismuhammad17/detrace"
Repository = "https://github.com/farismuhammad17/detrace.git"

[project.scripts]
detrace = "detrace.__main__:main"

[tool.setuptools]
packages = ["detrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
